# POC on-prem edge stack — 7 long-running containers (D7: Docker Compose,
# no K8s at site) + one-shot migrate. All image versions pinned; never use
# :latest (Watchtower incident).
#
# Port policy: only LAN-facing surfaces bind 0.0.0.0 (MQTT 1883 with
# auth+ACL, media 8554/8888/8889, UIs 3000/8080/18083). Unauthenticated dev
# backdoors (PG, Redis, MediaMTX control API) stay on 127.0.0.1.
#
# Bring-up: `make up` from repo root (copies .env.example -> .env first run).
name: iiot-poc

# Backend env shared by app-api / app-worker. The PG password exists exactly
# once (in .env); the DSN is assembled here.
x-app-env: &app-env
  POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
  REDIS_ADDR: ${REDIS_ADDR}
  MQTT_BROKER_URL: ${MQTT_BROKER_URL}
  MQTT_USERNAME: ${MQTT_USERNAME}
  MQTT_PASSWORD: ${MQTT_PASSWORD}
  MQTT_CLIENT_ID_PREFIX: ${MQTT_CLIENT_ID_PREFIX}
  MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX}
  LOG_LEVEL: ${LOG_LEVEL}
  SHUTDOWN_TIMEOUT_S: ${SHUTDOWN_TIMEOUT_S}

services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD} # consumed by initdb script
    ports:
      - "127.0.0.1:5433:5432" # dev/psql only (5432 often taken by a local PG)
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check on purpose: initdb's temporary server only listens on the
      # unix socket, so a socket-based pg_isready reports ready too early and
      # the follow-up internal restart flaps the container to unhealthy.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    image: migrate/migrate:v4.18.1
    restart: "no"
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"
    volumes:
      - ../../apps/backend/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379" # dev only — no auth configured
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  emqx:
    image: emqx/emqx:5.8.4
    restart: unless-stopped
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      EMQX_NODE__COOKIE: ${EMQX_NODE_COOKIE}
    ports:
      - "1883:1883"   # MQTT (gateways / simulator) — auth + ACL enforced
      - "18083:18083" # dashboard — team debug UI, see README
    volumes:
      - emqx_data:/opt/emqx/data
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./emqx/users-bootstrap.csv:/opt/emqx/etc/users-bootstrap.csv:ro
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  mediamtx:
    image: bluenviron/mediamtx:1.11.3-ffmpeg
    restart: unless-stopped
    ports:
      - "8554:8554"           # RTSP in (cameras / test publishers)
      - "8888:8888"           # HLS out
      - "8889:8889"           # WebRTC (WHEP) out
      - "8189:8189/udp"       # WebRTC ICE
      - "127.0.0.1:9997:9997" # control API — unauthenticated, keep off the LAN
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9997/v3/config/global/get"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # read-only datasource credentials (see postgres/initdb)
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "3000:3000" # ops-only dashboards (end users get the React web UI)
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  app-api:
    build: ../../apps/backend
    image: iiot-poc/app:dev
    restart: unless-stopped
    command: ["--role=api"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  app-worker:
    image: iiot-poc/app:dev
    restart: unless-stopped
    command: ["--role=worker"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8081" # health only; no host port needed
    depends_on:
      app-api:
        condition: service_started # reuses the image built by app-api
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pg_data:
  emqx_data:
  grafana_data:
