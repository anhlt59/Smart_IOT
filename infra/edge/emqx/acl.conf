%% EMQX file-based ACL — least privilege per MQTT user.
%% Topic tree (Interface Agreement, fixed tenant/park in POC):
%%   v1/demo/park01/{subsys}/{node}/telemetry|event|heartbeat|cmd|cmd/ack
%% Backend app: consumes uplink (shared subscription for load balance),
%% publishes downlink commands.
{allow, {user, "app"}, subscribe, ["v1/demo/park01/#", "$share/ingest/v1/demo/park01/#"]}.
{allow, {user, "app"}, publish, ["v1/demo/park01/+/+/cmd"]}.

%% Gateways / simulator: publish uplink + command acks, subscribe commands.
{allow, {user, "gateway1"}, publish, [
  "v1/demo/park01/+/+/telemetry",
  "v1/demo/park01/+/+/event",
  "v1/demo/park01/+/+/heartbeat",
  "v1/demo/park01/+/+/cmd/ack"
]}.
{allow, {user, "gateway1"}, subscribe, ["v1/demo/park01/+/+/cmd"]}.

{deny, all}.
