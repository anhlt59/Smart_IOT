# EMQX 5.x config. This file REPLACES the image default (bind mount), so the
# mandatory node block must be present. node.cookie comes from the
# EMQX_NODE__COOKIE env var (compose <- .env) to keep credentials out of git.
# Debug UI: http://<host>:18083 (admin / EMQX_DASHBOARD_PASSWORD from .env).
# Docs: https://docs.emqx.com/en/emqx/v5.8/

node {
  name = "emqx@127.0.0.1"
  data_dir = "data"
}

cluster {
  name = emqxcl
  # Single-node POC; also required by durable_sessions (builtin_local backend).
  discovery_strategy = singleton
}

# Username/password authentication (POC level — production moves to
# per-gateway certs / cert CN ACL per system-architecture.md).
# Users are imported once from the bootstrap CSV on first start; manage
# them afterwards in Dashboard > Access Control > Authentication.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = bcrypt
      salt_rounds = 10
    }
    bootstrap_file = "/opt/emqx/etc/users-bootstrap.csv"
    bootstrap_type = plain
  }
]

# File-based ACL: least-privilege per user under the Interface Agreement
# topic tree v1/{tenant}/{park}/... — see acl.conf.
authorization {
  no_match = deny
  deny_action = disconnect
  cache { enable = true }
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}

# Persistent sessions: QoS1 messages are retained for disconnected
# consumers (clean_session=false) and survive broker restarts.
durable_sessions {
  enable = true
}
